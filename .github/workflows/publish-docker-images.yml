name: Publish Docker images

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ${{ matrix.name }} image
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: app
            image: ghcr.io/arednel/dlsite-list-app
            dockerfile: docker/app.dockerfile

          - name: web
            image: ghcr.io/arednel/dlsite-list-web
            dockerfile: docker/web.dockerfile

    steps:
      - name: Check out release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

  publish-compose:
    name: Publish Compose application
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get release version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: echo "value=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Publish Compose application
        env:
          DLSITE_LIST_VERSION: ${{ steps.version.outputs.value }}
        run: |
          docker compose -f compose.yaml publish \
            --resolve-image-digests \
            --yes \
            ghcr.io/arednel/dlsite-list:${{ steps.version.outputs.value }}

      - name: Publish latest Compose application
        if: ${{ !github.event.release.prerelease }}
        env:
          DLSITE_LIST_VERSION: ${{ steps.version.outputs.value }}
        run: |
          docker compose -f compose.yaml publish \
            --resolve-image-digests \
            --yes \
            ghcr.io/arednel/dlsite-list:latest