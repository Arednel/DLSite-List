name: dlsite-list

x-app-image: &app_image ghcr.io/arednel/dlsite-list-app:${DLSITE_LIST_VERSION:-latest}

x-app-volumes: &app_volumes
  - storage_app:/var/www/dlsite_list/storage/app
  - storage_framework:/var/www/dlsite_list/storage/framework
  - storage_logs:/var/www/dlsite_list/storage/logs
  - secrets:/run/dlsite-secrets:ro

services:
    # Secrets initialization
    secrets-init:
        image: *app_image
        working_dir: /var/www/dlsite_list
        entrypoint: []
        command: ["php", "docker/init-secrets.php"]
        user: "0:0"
        volumes:
            - secrets:/run/dlsite-secrets
            - dbdata:/var/lib/mysql-existing:ro
        restart: "no"

    # Secrets initialization for tests
    secrets-init-test:
        profiles: ["test"]
        image: *app_image
        working_dir: /var/www/dlsite_list
        entrypoint: []
        command:
            - "php"
            - "docker/init-secrets.php"
            - "/run/dlsite-secrets"
            - "/var/lib/mysql-existing"
            - "/var/www/dlsite_list/docker/.env.testing.docker"
        user: "0:0"
        volumes:
            - secrets_test:/run/dlsite-secrets
            - dbdata_test:/var/lib/mysql-existing:ro
        restart: "no"

    # Application
    app:
        image: *app_image
        entrypoint: ["/usr/local/bin/docker-app-entrypoint.sh"] # Run Laravel migrations after db startup
        working_dir: /var/www/dlsite_list
        volumes: *app_volumes
        depends_on:
            secrets-init:
                condition: service_completed_successfully
            database:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "php", "artisan", "about", "--only=environment"]
            timeout: 20s
            retries: 10

    queue:
        image: *app_image
        working_dir: /var/www/dlsite_list
        command: ["php", "artisan", "queue:work"]
        volumes: *app_volumes
        depends_on:
            secrets-init:
                condition: service_completed_successfully
                restart: true
            app:
                condition: service_healthy
            database:
                condition: service_healthy
        restart: unless-stopped

    # One-off test runner
    tests:
        profiles: ["test"]
        image: *app_image
        working_dir: /var/www/dlsite_list
        command: ["php", "artisan", "test"]
        volumes:
            - secrets_test:/run/dlsite-secrets:ro
        depends_on:
            secrets-init-test:
                condition: service_completed_successfully
            database_test:
                condition: service_healthy

    # Web Server
    web:
        image: ghcr.io/arednel/dlsite-list-web:${DLSITE_LIST_VERSION:-latest}
        working_dir: /var/www/dlsite_list
        depends_on:
            - "app"
        ports:
            - 8080:80

    # Database
    database:
        image: mysql:8.0
        volumes:
            - dbdata:/var/lib/mysql
            - type: volume
              source: secrets
              target: /run/dlsite-secrets/db_password
              read_only: true
              volume:
                  nocopy: true
                  subpath: db_password
        depends_on:
            secrets-init:
                condition: service_completed_successfully
        environment:
            MYSQL_DATABASE: dlsite_list
            MYSQL_ROOT_PASSWORD_FILE: /run/dlsite-secrets/db_password
            MYSQL_PASSWORD_FILE: /run/dlsite-secrets/db_password
            MYSQL_USER: laravel
        healthcheck:
            test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
            timeout: 20s
            retries: 10

    # Test Database
    database_test:
        profiles: ["test"]
        image: mysql:8.0
        volumes:
            - dbdata_test:/var/lib/mysql
            - type: volume
              source: secrets_test
              target: /run/dlsite-secrets/db_password
              read_only: true
              volume:
                  nocopy: true
                  subpath: db_password
        depends_on:
            secrets-init-test:
                condition: service_completed_successfully
        environment:
            MYSQL_DATABASE: dlsite_list_test
            MYSQL_ROOT_PASSWORD_FILE: /run/dlsite-secrets/db_password
            MYSQL_PASSWORD_FILE: /run/dlsite-secrets/db_password
            MYSQL_USER: laravel
        healthcheck:
            test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
            timeout: 20s
            retries: 10

    # Database management (phpMyAdmin)
    # pma:
    #     image: phpmyadmin:5.2
    #     environment:
    #         - PMA_ARBITRARY=1
    #         - PMA_HOST=database
    #         - PMA_USER=laravel
    #         - PMA_PASSWORD_FILE=/run/dlsite-secrets/db_password
    #         - PMA_PORT=3306
    #     volumes:
    #         - type: volume
    #           source: secrets
    #           target: /run/dlsite-secrets/db_password
    #           read_only: true
    #           volume:
    #               nocopy: true
    #               subpath: db_password
    #     depends_on:
    #         database:
    #             condition: service_healthy
    #     ports:
    #         - 8888:80


volumes:
    storage_app:
    storage_framework:
    storage_logs:
    dbdata:
    dbdata_test:
    secrets:
    secrets_test: